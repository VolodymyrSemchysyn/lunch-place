[tool.poetry]
name = "lunch-place"
version = "0.1.0"
description = "Django REST API for lunch place voting"
authors = ["Volodymyr <uuforreasonsunknownuu@gmail.com>"]
packages = [
    { include = "lunch_voting" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry.dependencies]
python = ">=3.10,<3.13"
django = "^5.1.6"
djangorestframework = "^3.15.2"
djangorestframework-simplejwt = "^5.4.0"
psycopg = {extras = ["binary"], version = "^3.2.4"}
python-dotenv = "^1.0.1"
pytest = "^8.3.4"
pytest-django = "^4.10.0"
